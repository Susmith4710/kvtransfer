[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvtransfer"
version = "0.1.0"
description = "Cross-model KV cache transfer for LLM families (closed-form ridge mapper, arXiv:2608.03893) on Hugging Face transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "safetensors>=0.4",
  "transformers>=4.56",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
dev = ["pytest>=7"]

[project.scripts]
kvtransfer = "kvtransfer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
